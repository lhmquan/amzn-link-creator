<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f242e"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- nền bo góc -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- biểu tượng mắt xích (link) chéo, tượng trưng affiliate link -->
  <g transform="translate(256 236) rotate(-45)" fill="none" stroke="url(#amber)" stroke-width="34" stroke-linecap="round">
    <!-- mắt xích trên -->
    <path d="M -18 -78 h -34 a 52 52 0 0 0 -52 52 v 0 a 52 52 0 0 0 52 52 h 34"/>
    <!-- mắt xích dưới -->
    <path d="M 18 78 h 34 a 52 52 0 0 0 52 -52 v 0 a 52 52 0 0 0 -52 -52 h -34"/>
    <!-- thanh nối giữa -->
    <line x1="-40" y1="0" x2="40" y2="0"/>
  </g>

  <!-- nụ cười Amazon (mũi tên cong) -->
  <path d="M 150 372 q 106 62 212 0" fill="none" stroke="url(#amber)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 362 372 l -4 -30 m 4 30 l -30 4" fill="none" stroke="url(#amber)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
